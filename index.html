<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网站维护中 · 我的网站</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#f6f8fb;color:#17222e;
    display:flex;align-items:center;justify-content:center;padding:24px;
    -webkit-tap-highlight-color:transparent;
  }
  .card{
    background:#fff;border:1px solid #e4eaf1;border-radius:20px;
    max-width:440px;width:100%;padding:46px 36px 30px;text-align:center;
    box-shadow:0 12px 40px rgba(15,76,129,.08);
  }
  .logo{font-size:13px;color:#5b6b7b;letter-spacing:.1em;margin-bottom:26px}
  .logo b{color:#0f4c81}
  .gear{width:64px;height:64px;margin:0 auto 22px;animation:spin 5s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:28px;font-weight:800;letter-spacing:.02em}
  .sub{color:#5b6b7b;font-size:14.5px;line-height:1.8;margin-top:12px}
  .time{
    margin:28px 0 0;background:#f2f7fd;border:1px dashed #b9d4ef;
    border-radius:14px;padding:16px 14px;
  }
  .time .label{font-size:12.5px;color:#5b6b7b;letter-spacing:.08em}
  .time .range{
    font-size:24px;font-weight:800;color:#0f4c81;margin-top:6px;
    font-family:"SF Mono",ui-monospace,Consolas,monospace;letter-spacing:.04em;
  }
  .wechat{
    margin-top:28px;padding-top:22px;border-top:1px solid #edf1f5;
  }
  .wechat .t{font-size:12.5px;color:#5b6b7b;letter-spacing:.08em}
  .wechat b{
    display:inline-block;margin-top:8px;font-size:22px;letter-spacing:.12em;
    color:#0f4c81;background:#f2f7fd;border:1px solid #d7e6f5;
    padding:8px 20px;border-radius:10px;font-family:"SF Mono",ui-monospace,Consolas,monospace;
  }
  .wechat .hint{display:block;margin-top:10px;font-size:12.5px;color:#8b99a7}
  footer{margin-top:30px;font-size:12px;color:#a5b0bb}
  @media (max-width:480px){
    .card{padding:38px 22px 26px;border-radius:16px}
    h1{font-size:24px}
    .time .range{font-size:21px}
    .wechat b{font-size:19px}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">我的网站<b>·</b></div>
    <div class="gear">
      <svg viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="10" fill="#0f4c81"/>
        <path d="M24 3v7M24 38v7M3 24h7M38 24h7M8.8 8.8l5 5M34.2 34.2l5 5M39.2 8.8l-5 5M13.8 34.2l-5 5" stroke="#0f4c81" stroke-width="3.6" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>网站维护中</h1>
    <p class="sub">我们正在对网站进行升级维护，<br>维护期间暂时无法访问，给您带来不便敬请谅解。</p>
    <!-- 维护时间：直接修改下面这行里的两个时间即可 -->
    <div class="time">
      <div class="label">预计维护时间</div>
      <div class="range">7:30 — 7:50</div>
    </div>
    <div class="wechat">
      <div class="t">站长微信号</div>
      <b>BA3MJX</b>
      <span class="hint">维护期间如有问题，可添加站长微信联系</span>
    </div>
    <footer>个人兴趣小站 · 稍后见</footer>
  </div>
</body>
</html>
